name: Deploy

# Deploys the backoffice to the production VPS once the admin E2E suite has
# passed for a push to master, using the exact commit that suite tested. The
# VPS builds the image itself (arunika-backend/deploy/deploy.sh); CI only asks
# it to over SSH.
#
# Run it by hand with a `ref` to redeploy or roll back to any commit on master.
on:
  workflow_run:
    workflows: ["Merge (admin E2E)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch to deploy (must be on master)
        required: true
        default: master

permissions:
  contents: read

# deploy.sh's lock on the VPS serialises this against backend deploys.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  ADMIN_URL: https://admin.haloarunika.com

jobs:
  deploy:
    name: Deploy backoffice
    # Merge also runs for master-new and main; only master is production.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}

      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The deploy key only runs deploy.sh (a forced command on the VPS), and
      # the host key is pinned rather than trusted on first use.
      - name: Deploy on the VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "backoffice $SHA"

      - name: Check the site through Caddy
        run: |
          headers=$(curl -fsSI --retry 5 --retry-delay 3 --retry-all-errors "$ADMIN_URL")
          echo "$headers"
          grep -qi '^strict-transport-security:' <<<"$headers" || {
            echo "HSTS header missing on $ADMIN_URL"; exit 1; }
