# Included in every location in nginx.conf. nginx drops all inherited
# add_header directives from a block that declares any of its own, so these
# can't live at server level once a location sets Cache-Control.
#
# __API_ORIGIN__ is replaced at image build time with the origin of
# VITE_API_BASE_URL (see Dockerfile).
#
# style-src needs 'unsafe-inline': Ant Design injects its CSS-in-JS as <style>
# tags at runtime. img-src allows any https: origin because banner and campaign
# images are admin-entered URLs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: __API_ORIGIN__; font-src 'self' data:; connect-src 'self' __API_ORIGIN__; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
